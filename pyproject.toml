[project]
name = "braid-quantum-gravity-reproducibility"
version = "1.0.0"
description = "Public exact-check package for Subjectivity-Intersection Braid Quantum Gravity"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.4"]
license = "Apache-2.0"
authors = [{name = "Satoru Watanabe"}]

[project.urls]
Repository = "https://github.com/SIEL-Research/Braid-Quantum-Gravity-Reproducibility"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
